
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990">
<defs>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6366F1">
      <animate attributeName="stop-color" values="#6366F1;#22D3EE;#A78BFA;#6366F1" dur="9s" repeatCount="indefinite"/>
    </stop>
    <stop offset=".5" stop-color="#A78BFA">
      <animate attributeName="stop-color" values="#A78BFA;#6366F1;#22D3EE;#A78BFA" dur="9s" repeatCount="indefinite"/>
    </stop>
    <stop offset="1" stop-color="#22D3EE">
      <animate attributeName="stop-color" values="#22D3EE;#A78BFA;#6366F1;#22D3EE" dur="9s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" stroke="#26344B" stroke-width=".6" fill="none"/>
  </pattern>
  <radialGradient id="ambient">
    <stop stop-color="#4F46E5" stop-opacity=".23"/>
    <stop offset="1" stop-color="#090D16" stop-opacity="0"/>
  </radialGradient>
  <style>
    .kicker{font:11px monospace;letter-spacing:2.5px;fill:#8292AD}
    .hero{font:700 49px Arial,sans-serif;letter-spacing:-2px;fill:#F8FAFC}
    .desc{font:14px Arial,sans-serif;fill:#8795AC}
    .section{font:11px monospace;letter-spacing:2px;fill:#A5B4FC}
    .title{font:600 20px Arial,sans-serif;fill:#F1F5F9}
    .muted{font:12px Arial,sans-serif;fill:#8492A8}
    .pill{fill:#182236;stroke:#2D3D59;stroke-width:1}
    .pilltext{font:12px Arial,sans-serif;fill:#D3DBE9}
    .card{fill:#101725;stroke:#29364C;stroke-width:1}
    .small{font:10px monospace;fill:#6E809C;letter-spacing:1px}
  </style>
</defs>

<!-- BACKGROUND -->
<rect width="1200" height="990" rx="22" fill="#090D16"/>
